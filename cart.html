<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Decozin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

</head>

<body>

    <div id="topbar"></div>
    <div id="navbar"></div>

    <section class="cart-page">

        <div class="container">

            <!-- Breadcrumb -->

            <nav class="breadcrumb-area">

                <a href="index.html">Home</a>

                <span>/</span>

                <span>Shopping Cart</span>

            </nav>

            <h2 class="page-title">

                Shopping Cart

            </h2>

            <div class="row">

                <!-- Cart Items -->

                <div class="col-lg-8">

                    <div id="cartItems">

                        <!-- Item -->

                        <div class="cart-item">

                            <div class="cart-image">

                                <img src="images/products/saree1.jpg">

                            </div>

                            <div class="cart-details">

                                <h4>Premium Silk Saree</h4>

                                <p>Color : Maroon</p>

                                <span class="price">

                                    ₹1,999

                                </span>

                            </div>

                            <div class="cart-qty">

                                <button>-</button>

                                <input type="text" value="1">

                                <button>+</button>

                            </div>

                            <div class="cart-total">

                                ₹1,999

                            </div>

                            <button class="remove-btn">

                                <i class="fa-solid fa-trash"></i>

                            </button>

                        </div>

                    </div>

                    <!-- Coupon -->

                    <div class="coupon-box">

                        <input type="text" placeholder="Enter Coupon Code">

                        <button>

                            Apply

                        </button>

                    </div>

                </div>

                <!-- Summary -->

                <div class="col-lg-4">

                    <div class="summary-box">

                        <h3>

                            Order Summary

                        </h3>

                        <div class="summary-row">

                            <span>Subtotal</span>

                            <span>₹1,999</span>

                        </div>

                        <div class="summary-row">

                            <span>Shipping</span>

                            <span>FREE</span>

                        </div>

                        <div class="summary-row">

                            <span>Discount</span>

                            <span>-₹200</span>

                        </div>

                        <hr>

                        <div class="summary-row total">

                            <span>Total</span>

                            <span>₹1,799</span>

                        </div>

                        <a href="checkout.html" class="checkout-btn">

                            Proceed To Checkout

                        </a>

                        <a href="shop.html" class="continue-btn">

                            Continue Shopping

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <div id="newsletter"></div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/components.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/navbar-user.js"></script>

</body>

</html>
