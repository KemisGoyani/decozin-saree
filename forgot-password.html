<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Decozin Saree Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div id="topbar"></div>
    <div id="navbar"></div>

    <section class="auth-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="auth-card">

                        <!-- STEP 1 -->
                        <div id="emailStep">

                            <h2 class="text-center">
                                Forgot Password
                            </h2>

                            <p class="text-center text-muted mb-4">
                                Enter your registered email address.
                            </p>

                            <form id="forgotPasswordForm">

                                <div class="mb-3">

                                    <label>Email Address</label>

                                    <input type="email" id="email" class="form-control"
                                        placeholder="Enter your registered email">

                                    <small id="emailError" class="error">
                                    </small>

                                </div>

                                <button type="submit" id="sendOtpBtn" class="login-btn">

                                    Send OTP

                                </button>

                            </form>

                        </div>

                        <!-- STEP 2 -->
                        <div id="otpStep" style="display:none;">

                            <h2>Verify OTP</h2>

                            <p>
                                Enter the 6-digit OTP sent to
                                <span id="otpEmail"></span>
                            </p>

                            <div class="otp-boxes">

                                <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
                                    class="otp-digit">
                                <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
                                    class="otp-digit">
                                <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
                                    class="otp-digit">
                                <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
                                    class="otp-digit">
                                <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
                                    class="otp-digit">
                                <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
                                    class="otp-digit">

                            </div>

                            <div class="text-center mt-3">

                                <small id="otpTimer" class="text-muted">
                                    OTP expires in 02:00
                                </small>

                                <br>

                                <a href="#" id="resendOtp" class="text-decoration-none">
                                    Resend OTP
                                </a>

                            </div>

                            <button id="verifyOtpBtn" class="login-btn">
                                Verify OTP
                            </button>

                        </div>

                        <!-- STEP 3 -->
                        <!-- Reset Password Step -->
                        <div id="passwordStep" style="display:none;">

                            <div class="text-center mb-4">

                                <i class="fa-solid fa-lock fa-3x text-success mb-3"></i>

                                <h2>Create New Password</h2>

                                <p>
                                    Your new password must be different from your previous password.
                                </p>

                            </div>

                            <div class="mb-3">

                                <label>New Password</label>

                                <div class="password-box">

                                    <input type="password" id="newPassword" class="form-control"
                                        placeholder="Enter New Password">

                                    <button type="button" id="toggleNewPassword">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                                <small id="newPasswordError" class="error"></small>

                            </div>

                            <div class="mb-3">

                                <label>Confirm Password</label>

                                <div class="password-box">

                                    <input type="password" id="confirmPassword" class="form-control"
                                        placeholder="Confirm Password">

                                    <button type="button" id="toggleConfirmPassword">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                                <small id="confirmPasswordError" class="error"></small>

                            </div>

                            <button id="resetBtn" class="login-btn">

                                Reset Password

                            </button>

                        </div>

                        <div class="text-center mt-4">

                            Back to Login ?

                            <a href="login.html">

                                Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Toast -->

    <div class="toast-container position-fixed top-0 end-0 p-3">

        <div id="liveToast" class="toast border-0">

            <div class="d-flex">

                <div class="toast-body" id="toastMessage">
                </div>

                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast">
                </button>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/components.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth-api.js"></script>
    <script src="js/forgot-password.js"></script>

</body>

</html>
